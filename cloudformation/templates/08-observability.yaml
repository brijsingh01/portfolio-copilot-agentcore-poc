AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Portfolio Advisory Copilot - OPTIONAL account-level observability. Enables CloudWatch Transaction Search so
  ADOT / X-Ray spans from AgentCore Runtimes, Gateway and Lambda land in the `aws/spans` log group.
  This is an account+region singleton: deploy it at most once per account/region and skip it if Transaction
  Search is already enabled (CREATE fails with "already exists").

Parameters:
  IndexingPercentage:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 100
    Description: Percentage of spans indexed as trace summaries (all spans are still ingested).

Resources:
  XRayToLogsPolicy:
    Type: AWS::Logs::ResourcePolicy
    Properties:
      PolicyName: TransactionSearchAccess
      PolicyDocument: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [{
            "Sid": "TransactionSearchXRayAccess",
            "Effect": "Allow",
            "Principal": {"Service": "xray.amazonaws.com"},
            "Action": "logs:PutLogEvents",
            "Resource": [
              "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:aws/spans:*",
              "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/application-signals/data:*"
            ],
            "Condition": {
              "ArnLike": {"aws:SourceArn": "arn:${AWS::Partition}:xray:${AWS::Region}:${AWS::AccountId}:*"},
              "StringEquals": {"aws:SourceAccount": "${AWS::AccountId}"}
            }
          }]
        }

  TransactionSearch:
    Type: AWS::XRay::TransactionSearchConfig
    DependsOn: XRayToLogsPolicy
    Properties:
      IndexingPercentage: !Ref IndexingPercentage

Outputs:
  SpansLogGroup:
    Value: aws/spans
