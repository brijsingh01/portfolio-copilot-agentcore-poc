AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Portfolio Advisory Copilot - downstream AgentCore Runtimes, both in VPC mode:
  Quant Calculator MCP server (MCP :8000, IAM/SigV4 inbound - only the Gateway role can call it),
  and the Market Analyst agent (A2A :9000, called directly by the orchestrator; inbound JWT = shared audience + azp
  claim).

Parameters:
  Prefix:
    Type: String
    AllowedPattern: "^[a-z][a-z0-9-]{2,40}$"
  RuntimeNamePrefix:
    Type: String
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]{0,30}$"
    Description: AgentCore runtime names allow only letters, digits and underscores.
  QuantMcpImageUri:
    Type: String
  MarketAnalystImageUri:
    Type: String
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  JwtIssuer:
    Type: String
  DiscoveryUrl:
    Type: String
    AllowedPattern: "^https://.+/\\.well-known/openid-configuration$"
  JwtAudience:
    Type: String
  JwtAzp:
    Type: String
    AllowedPattern: "^[A-Za-z0-9_.-]+$"
  AdvisorIdClaim:
    Type: String
  ClientIdClaim:
    Type: String
  LlmModelId:
    Type: String
    Default: amazon.nova-micro-v1:0
    AllowedPattern: "^amazon\\.nova-.*"
  MarketAnalystSystemPrompt:
    Type: String
    MinLength: 20
    MaxLength: 4000
    Description: System prompt text (source of truth src/prompts/market-analyst_system.txt, published by the driver)
  MarketAnalystPromptRevision:
    Type: String
    AllowedPattern: "^[a-f0-9]{8,64}$"
    Description: Content hash of the prompt text; a new value publishes a new immutable prompt version
  IdleSessionTimeout:
    Type: Number
    Default: 900

Resources:
  # ------------------------------------------------------------------ Bedrock Prompt Management
  MarketAnalystPrompt:
    Type: AWS::Bedrock::Prompt
    Properties:
      Name: !Sub ${Prefix}-market-analyst-system
      Description: Market Analyst system prompt (the runtime loads a pinned version)
      DefaultVariant: default
      Variants:
        - Name: default
          TemplateType: TEXT
          ModelId: !Ref LlmModelId
          InferenceConfiguration:
            Text: { MaxTokens: 400, Temperature: 0.2 }
          TemplateConfiguration:
            Text:
              Text: !Ref MarketAnalystSystemPrompt
      Tags: { project: !Ref Prefix }

  MarketAnalystPromptVersion:
    Type: AWS::Bedrock::PromptVersion
    Properties:
      PromptArn: !GetAtt MarketAnalystPrompt.Arn
      Description: !Sub "revision ${MarketAnalystPromptRevision}"   # replaced (new version) when the text changes
      Tags: { project: !Ref Prefix }

  # ------------------------------------------------------------------ execution roles
  QuantMcpRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${Prefix}-quant-mcp-runtime-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: bedrock-agentcore.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
              ArnLike: { aws:SourceArn: !Sub "arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:*" }
      Policies:
        - PolicyName: runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: PullImage
                Effect: Allow
                Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer]
                Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${Prefix}/quant-mcp
              - Sid: EcrAuth
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogStreams]
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*
              - Sid: DescribeLogs
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:*
              - Sid: Tracing
                Effect: Allow
                Action: [xray:PutTraceSegments, xray:PutTelemetryRecords, xray:GetSamplingRules, xray:GetSamplingTargets]
                Resource: "*"
              - Sid: Metrics
                Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
                Condition: { StringEquals: { cloudwatch:namespace: bedrock-agentcore } }

  MarketAnalystRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${Prefix}-market-analyst-runtime-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: bedrock-agentcore.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
              ArnLike: { aws:SourceArn: !Sub "arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:*" }
      Policies:
        - PolicyName: runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: PullImage
                Effect: Allow
                Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer]
                Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${Prefix}/market-analyst
              - Sid: EcrAuth
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogStreams]
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*
              - Sid: DescribeLogs
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:*
              - Sid: Tracing
                Effect: Allow
                Action: [xray:PutTraceSegments, xray:PutTelemetryRecords, xray:GetSamplingRules, xray:GetSamplingTargets]
                Resource: "*"
              - Sid: Metrics
                Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
                Condition: { StringEquals: { cloudwatch:namespace: bedrock-agentcore } }
              - Sid: WorkloadIdentity
                Effect: Allow
                Action: [bedrock-agentcore:GetWorkloadAccessToken, bedrock-agentcore:GetWorkloadAccessTokenForJWT]
                Resource:
                  - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default
                  - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default/workload-identity/${RuntimeNamePrefix}_*
              - Sid: NovaOnly
                Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
                Resource:
                  - !Sub arn:aws:bedrock:*::foundation-model/${LlmModelId}
                  - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.${LlmModelId}
              - Sid: ManagedSystemPrompt
                Effect: Allow
                Action: bedrock:GetPrompt
                Resource: [!GetAtt MarketAnalystPrompt.Arn, !Sub "${MarketAnalystPrompt.Arn}:*"]

  # ------------------------------------------------------------------ runtimes
  QuantMcpRuntime:
    Type: AWS::BedrockAgentCore::Runtime
    Properties:
      AgentRuntimeName: !Sub ${RuntimeNamePrefix}_quant_mcp
      Description: Quant Calculator MCP server (calculate_rebalance, estimate_tax_drag, check_single_stock_exposure)
      RoleArn: !GetAtt QuantMcpRole.Arn
      AgentRuntimeArtifact:
        ContainerConfiguration:
          ContainerUri: !Ref QuantMcpImageUri
      ProtocolConfiguration: MCP
      NetworkConfiguration:
        NetworkMode: VPC
        NetworkModeConfig:
          Subnets: !Ref PrivateSubnetIds
          SecurityGroups: [!Ref SecurityGroupId]
      LifecycleConfiguration: { IdleRuntimeSessionTimeout: !Ref IdleSessionTimeout, MaxLifetime: 28800 }
      EnvironmentVariables:
        AWS_REGION: !Ref AWS::Region
        OTEL_SERVICE_NAME: quant-mcp
        LOG_LEVEL: INFO
      Tags: { project: !Ref Prefix }

  MarketAnalystRuntime:
    Type: AWS::BedrockAgentCore::Runtime
    Properties:
      AgentRuntimeName: !Sub ${RuntimeNamePrefix}_market_analyst
      Description: Market Analyst A2A agent (Amazon Nova Micro commentary), called directly by the orchestrator
      RoleArn: !GetAtt MarketAnalystRole.Arn
      AgentRuntimeArtifact:
        ContainerConfiguration:
          ContainerUri: !Ref MarketAnalystImageUri
      ProtocolConfiguration: A2A
      NetworkConfiguration:
        NetworkMode: VPC
        NetworkModeConfig:
          Subnets: !Ref PrivateSubnetIds
          SecurityGroups: [!Ref SecurityGroupId]
      LifecycleConfiguration: { IdleRuntimeSessionTimeout: !Ref IdleSessionTimeout, MaxLifetime: 28800 }
      AuthorizerConfiguration:
        CustomJWTAuthorizer:
          DiscoveryUrl: !Ref DiscoveryUrl
          AllowedAudience: [!Ref JwtAudience]
          CustomClaims:
            - InboundTokenClaimName: azp
              InboundTokenClaimValueType: STRING
              AuthorizingClaimMatchValue:
                ClaimMatchOperator: EQUALS
                ClaimMatchValue: { MatchValueString: !Ref JwtAzp }
      RequestHeaderConfiguration:
        RequestHeaderAllowlist: [Authorization]
      EnvironmentVariables:
        JWT_ISSUER: !Ref JwtIssuer
        JWT_DISCOVERY_URL: !Ref DiscoveryUrl
        JWT_AUDIENCES: !Ref JwtAudience
        JWT_ALLOWED_CLIENT_IDS: !Ref JwtAzp
        JWT_ADVISOR_CLAIM: !Ref AdvisorIdClaim
        JWT_CLIENT_CLAIM: !Ref ClientIdClaim
        AWS_REGION: !Ref AWS::Region
        BEDROCK_MODEL_ID: !Sub us.${LlmModelId}
        SYSTEM_PROMPT_ID: !GetAtt MarketAnalystPrompt.Id
        SYSTEM_PROMPT_VERSION: !GetAtt MarketAnalystPromptVersion.Version
        OTEL_SERVICE_NAME: market-analyst
        LOG_LEVEL: INFO
      Tags: { project: !Ref Prefix }

Outputs:
  QuantMcpRuntimeArn:
    Value: !GetAtt QuantMcpRuntime.AgentRuntimeArn
  QuantMcpRuntimeId:
    Value: !GetAtt QuantMcpRuntime.AgentRuntimeId
  MarketAnalystRuntimeArn:
    Value: !GetAtt MarketAnalystRuntime.AgentRuntimeArn
  MarketAnalystRuntimeId:
    Value: !GetAtt MarketAnalystRuntime.AgentRuntimeId
  # Invocation URLs embed the URL-encoded runtime ARN (arn:aws:bedrock-agentcore:<region>:<account>:runtime/<id>).
  QuantMcpRuntimeUrl:
    Value: !Sub https://bedrock-agentcore.${AWS::Region}.amazonaws.com/runtimes/arn%3Aaws%3Abedrock-agentcore%3A${AWS::Region}%3A${AWS::AccountId}%3Aruntime%2F${QuantMcpRuntime.AgentRuntimeId}
  MarketAnalystRuntimeUrl:
    Value: !Sub https://bedrock-agentcore.${AWS::Region}.amazonaws.com/runtimes/arn%3Aaws%3Abedrock-agentcore%3A${AWS::Region}%3A${AWS::AccountId}%3Aruntime%2F${MarketAnalystRuntime.AgentRuntimeId}
  MarketAnalystPromptArn:
    Value: !GetAtt MarketAnalystPrompt.Arn
  MarketAnalystPromptId:
    Value: !GetAtt MarketAnalystPrompt.Id
  MarketAnalystPromptVersion:
    Value: !GetAtt MarketAnalystPromptVersion.Version
